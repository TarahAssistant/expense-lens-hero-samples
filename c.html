  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/hero.css">
</head>
<body>
  <div class="grid-overlay" aria-hidden="true"></div>
  <div class="sample-bar">
    <a href="index.html">Samples</a>
    <a href="a.html">A</a>
    <a href="b.html">B</a>
    <a href="c.html" class="on">C</a>
    <a href="d.html">D</a>
    QR code in the lens
  </div>
  <nav class="nav">
    <a class="brand" href="#">Expense Lens</a>
    <ul><li><a href="#">Features</a></li><li><a href="#">Pricing</a></li><li><a href="#">Roadmap</a></li><li><a href="#">FAQ</a></li><li><a href="#">Blog</a></li><li><a href="#">Login</a></li></ul>
  </nav>
  <section class="hero" style="padding-top:64px">
    <div class="container">
      <div class="c-wrap">
        <h1 class="display">AI Receipt <span class="grad">Scanning</span> <br>That Does <span class="grad">Itself</span><span class="dot">.</span></h1>
        <p class="sub" style="text-align:center">Snap a receipt. AI extracts merchant, amount, date, and currency in seconds. Now on iPhone.</p>
        <div class="c-lens desktop-only">
          <div class="lens" aria-hidden="true">
            <div class="lens-ring glow" style="width:340px;height:340px"></div>
            <div class="lens-ring dash spin" style="width:260px;height:260px"></div>
            <div class="lens-ring" style="width:340px;height:340px;border-color:rgba(20,184,166,0.18)"></div>
            <div class="lens-ring dash spin" style="width:520px;height:520px"></div>
            <div class="lens-ring" style="width:640px;height:640px"></div>
          </div>
          <div class="c-focus">
            <div class="c-qrbox">
              <span class="c-corner tl"></span><span class="c-corner tr"></span><span class="c-corner bl"></span><span class="c-corner br"></span>
              <a class="qr" href="https://apps.apple.com/us/app/expense-lens-scan-track/id6789503509" aria-label="Open Expense Lens on the App Store"><img src="assets/app-store-qr.svg" alt="QR code linking to the App Store listing"></a>
            </div>
            <span class="qr-cap">Scan to install on iPhone</span>
          </div>
        </div>
        <div class="c-cta">
          <a class="badge" href="https://apps.apple.com/us/app/expense-lens-scan-track/id6789503509"><img src="assets/app-store-badge.svg" alt="Download on the App Store" width="168" height="52"></a>
          <a class="btn" href="https://app.expense-lens.com/signup">Get Started Free</a>
        </div>
      </div>
    </div>
  </section>
</body>
